# Тестовый PostgreSQL для интеграционных тестов.
#
# Версия 17 не случайна: прод — Yandex Managed PostgreSQL 17, а локально в
# системе стоит 16. Тесты трогают schema_migrations и гоняют TRUNCATE, поэтому
# база обязана быть одноразовой и отдельной от рабочей.
#
#   docker compose -f docker-compose.test.yml up -d
#   npm run test:db:setup
services:
  postgres-test:
    image: postgres:17
    container_name: stroyfoto-test-pg
    environment:
      POSTGRES_USER: stroyfoto
      POSTGRES_PASSWORD: test
      POSTGRES_DB: stroyfoto_test
    ports:
      - '55432:5432'
    # tmpfs: база живёт в памяти и исчезает вместе с контейнером — данным
    # тестов незачем переживать перезапуск, зато прогон заметно быстрее.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stroyfoto -d stroyfoto_test']
      interval: 2s
      timeout: 3s
      retries: 15
